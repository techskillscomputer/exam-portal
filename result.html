<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Exam Result</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="result-container">

    <div class="result-box">

        <div class="logo-circle">
            TS
        </div>

        <h1>
            TECH SKILLS
        </h1>

        <p>
            COMPUTER INSTITUTE
        </p>


        <h2>Examination Result</h2>


        <div class="result-details">

            <p>
                <b>Student Name:</b>
                <span id="studentName"></span>
            </p>


            <p>
                <b>Total Questions:</b>
                <span id="totalQuestions"></span>
            </p>


            <p>
                <b>Correct Answers:</b>
                <span id="correctAnswers"></span>
            </p>


            <p>
                <b>Wrong Answers:</b>
                <span id="wrongAnswers"></span>
            </p>


            <p>
                <b>Percentage:</b>
                <span id="percentage"></span>%
            </p>


            <h2 id="resultMessage"></h2>

        </div>


        <div class="result-buttons">

            <button
                onclick="goDashboard()"
                class="main-btn"
            >
                Back to Dashboard
            </button>


            <button
                onclick="logout()"
                class="secondary-btn"
            >
                Logout
            </button>

        </div>

    </div>

</div>


<script>

const studentName =
    localStorage.getItem("studentName") || "Student";


const score =
    Number(localStorage.getItem("examScore")) || 0;


const total =
    Number(localStorage.getItem("totalQuestions")) || 0;


const wrong =
    total - score;


const percentage =
    total > 0
    ? ((score / total) * 100).toFixed(2)
    : 0;


document.getElementById("studentName")
    .textContent = studentName;


document.getElementById("totalQuestions")
    .textContent = total;


document.getElementById("correctAnswers")
    .textContent = score;


document.getElementById("wrongAnswers")
    .textContent = wrong;


document.getElementById("percentage")
    .textContent = percentage;


if (percentage >= 40) {

    document.getElementById("resultMessage")
        .textContent =
        "PASS - Congratulations!";

} else {

    document.getElementById("resultMessage")
        .textContent =
        "FAIL - Better Luck Next Time!";

}


function goDashboard() {

    window.location.href =
        "dashboard.html";

}


function logout() {

    localStorage.clear();

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
